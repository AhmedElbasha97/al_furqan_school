name: al_furqan_school
description: Al-Furqan Private Schools Application - مدارس الفرقان الخاصة
publish_to: 'none'
version: 3.2.1+110
environment:
  sdk: ^3.5.3
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Navigation
  cupertino_icons: ^1.0.8
  get: ^4.7.3
  provider: 6.1.5+1
  carousel_slider: 5.1.2
  expandable: ^5.0.1
  flutter_html: ^3.0.0
  cached_network_image: ^3.4.1

  # Networking
  dio: 5.11.0

  # Firebase
  firebase_core: 4.13.0
  firebase_messaging: 16.5.0
  firebase_analytics: 12.4.6

  # Notifications
  flutter_local_notifications: 20.1.0

  # Storage
  shared_preferences: 2.5.5
  flutter_secure_storage: ^9.2.2

  # Media & Files
  image_picker: 1.2.3
  file_picker: 10.3.10
  open_file: 3.5.11
  file_saver: 0.3.1
  webview_flutter: 4.14.1

  # Utilities
  url_launcher: 6.3.2
  map_launcher: ^4.4.3
  share_plus: 12.0.1
  in_app_update: 5.0.0

  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - i18n/ar.json
    - i18n/en.json
  fonts:
    - family: DroidKufi
      fonts:
        - asset: assets/fonts/DroidKufiRegular.ttf
        - asset: assets/fonts/DroidKufiBold.ttf
          weight: 700

dev_dependencies:
  flutter_test:
    sdk: flutter